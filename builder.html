<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rack · Plan builder</title>
<meta name="theme-color" content="#1C242D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#1C242D;--surface:#273240;--surface2:#33424F;--line:#3E5062;--text:#F3F6F8;--muted:#9AAABA;--accent:#FF7A1A;--accent-ink:#1C1208;--good:#5BD99A;--danger:#FF6B6B}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,-apple-system,"Helvetica Neue",Arial,sans-serif;font-weight:500;font-size:16px;line-height:1.35}
  input,textarea,select,button{font:inherit;color:inherit}
  button{border:0;background:none;padding:0;cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 18px 80px}
  header.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  header.top h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1}
  header.top p{margin:4px 0 0;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--surface);border-radius:16px;padding:16px}
  .panel h2{margin:0 0 12px;font-size:20px;font-weight:800}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .field input,.field textarea,.search{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
  .field input:focus,.field textarea:focus,.search:focus{border-color:var(--accent);outline:0}
  .field textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .fields{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;background:var(--surface2);font-weight:700;font-size:15px;white-space:nowrap}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.ghost{background:none;color:var(--accent)}
  .btn.danger{color:var(--danger)}
  .btn.small{min-height:32px;padding:0 10px;font-size:14px;border-radius:8px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .stack{display:flex;flex-direction:column;gap:8px}
  .hint{color:var(--muted);font-size:14px;margin:6px 0 0}

  .stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .stabs button{padding:8px 12px;border-radius:9px;background:var(--surface2);font-weight:700;font-size:15px}
  .stabs button.on{background:var(--accent);color:var(--accent-ink)}
  .sname{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .sname input{flex:1;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:18px;font-weight:700}

  .row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:8px 8px 8px 6px;min-height:58px;position:relative}
  .row .icon{width:38px;height:38px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:21px;flex:none}
  .row .body{flex:1;min-width:0}
  .row .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .meta{color:var(--muted);font-size:13px}
  .row.dragging{z-index:5;box-shadow:0 12px 28px rgba(0,0,0,.45);background:var(--surface2)}
  .row.shift{transition:transform .15s ease}
  .handle{width:32px;height:44px;display:grid;place-items:center;color:var(--muted);touch-action:none;cursor:grab;flex:none}
  .handle svg{width:18px;height:18px}
  .tgt{display:flex;align-items:center;gap:4px;flex:none;font-size:14px;color:var(--muted)}
  .tgt input{width:48px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:6px 6px;text-align:center;font-weight:700;font-size:15px}
  .tgt input.reps{width:62px}
  .arrows{display:flex;flex-direction:column;gap:2px;flex:none}
  .arrows button{width:30px;height:20px;border-radius:6px;background:var(--surface2);font-size:11px;display:grid;place-items:center}
  .arrows button:disabled{opacity:.3}
  .remove{width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:18px;display:grid;place-items:center;flex:none}
  .remove:hover{color:var(--danger)}
  .empty{padding:24px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}

  .lib{max-height:60vh;overflow:auto;border-radius:12px}
  .pick{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer}
  .pick:hover{background:var(--surface2)}
  .pick .icon{width:34px;height:34px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-size:19px;flex:none}
  .pick .name{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pick .cat{color:var(--muted);font-size:13px;flex:none}
  .pick .plus{color:var(--accent);font-weight:800;font-size:20px;width:32px;text-align:center;flex:none}
  .pick .plus.in{color:var(--good);font-size:13px}
  .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .cats button{padding:5px 10px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted)}
  .cats button.on{background:var(--text);color:var(--bg)}

  .out{background:var(--surface);border-radius:16px;padding:16px;margin-top:22px}
  .out code{display:block;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;word-break:break-all;margin-top:6px;font-family:ui-monospace,Menlo,monospace;max-height:80px;overflow:auto}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;pointer-events:none;opacity:0;transition:opacity .2s}
  .toast.show{opacity:1}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
  .sheet{background:var(--bg);width:100%;max-width:520px;max-height:90vh;border-radius:18px;padding:18px;overflow:auto}
  .sheet h3{margin:0 0 12px;font-size:20px;font-weight:800}
  @media (prefers-reduced-motion:reduce){.row.shift{transition:none}.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><h1>Plan builder</h1><p>Build sessions here, or import a client's workbook, then hand it over as a file or a link.</p></div>
    <div class="bar" style="margin:0 0 0 auto">
      <button class="btn" data-open>Open a plan file</button>
      <button class="btn" data-workbook>Import from workbook (.xlsx)</button>
      <button class="btn ghost danger" data-reset>Start over</button>
    </div>
  </header>

  <div class="panel" style="margin-bottom:22px">
    <div class="fields">
      <div class="field"><label>Plan name (what the person sees)</label><input data-f="name" placeholder="e.g. Hugo's plan"></div>
      <div class="field"><label>Plan id (file name, no spaces)</label><input data-f="id" placeholder="hugo"></div>
      <div class="field"><label>Version (bump when you change it)</label><input data-f="version" type="number" min="1" step="1"></div>
    </div>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>Sessions</h2>
      <div class="stabs" id="stabs"></div>
      <div id="session"></div>
    </div>
    <div class="panel">
      <h2>Exercise library</h2>
      <input class="search" placeholder="Search exercises" id="q">
      <div class="cats" id="cats"></div>
      <div class="lib" id="lib"></div>
      <div class="bar"><button class="btn" data-new-ex>+ New exercise</button><button class="btn" data-import>Import from a spreadsheet</button></div>
      <p class="hint">Click an exercise to add it to the selected session. Exercises you add here travel with the plan.</p>
    </div>
  </div>

  <div class="out">
    <h2 style="margin:0 0 4px;font-size:20px;font-weight:800">Hand it over</h2>
    <div class="field" style="margin-top:12px"><label>Where the app lives (the index.html URL)</label><input data-f="appUrl" placeholder="https://example.com/rack/index.html"></div>
    <div class="bar">
      <button class="btn primary" data-download>Download plan file</button>
      <button class="btn" data-copy-link>Copy share link</button>
      <button class="btn" data-copy-file-link>Copy file link</button>
    </div>
    <p class="hint" data-linkinfo></p>
  </div>
</div>
<div class="toast" id="toast"></div>

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('[data-f]').forEach(i=>{ if(document.activeElement!==i) i.value=st[i.dataset.f]??''; });

  document.getElementById('stabs').innerHTML=st.sessions.map(x=>`<button class="${x.id===ui.sel?'on':''}" data-sel="${x.id}">${esc(x.name||'Untitled')}</button>`).join('')+`<button data-add-session>+ Add session</button>`;
  const sess=document.getElementById('session');
  if(!s){ sess.innerHTML=`<div class="empty">Add a session to get started.</div>`; }
  else {
    const items=s.items.map((id,i)=>{ const e=exById(id); if(!e) return ''; const t=s.targets[id]||{sets:3,reps:'8-10'};
      return `<div class="row" data-id="${id}"><div class="handle">${I_HANDLE}</div><div class="icon">${esc(e.icon)}</div>
        <div class="body"><div class="name">${esc(e.name)}</div><div class="meta">${esc(e.category||'')}</div></div>
        <div class="tgt"><input type="number" min="1" value="${t.sets}" data-tgt="${id}:sets" aria-label="Sets"><span>×</span><input class="reps" value="${esc(t.reps)}" data-tgt="${id}:reps" aria-label="Rep range" placeholder="8-10"></div>
        <div class="arrows"><button data-move="${i}:-1" ${i===0?'disabled':''}>▲</button><button data-move="${i}:1" ${i===s.items.length-1?'disabled':''}>▼</button></div>
        <button class="remove" data-remove="${i}" aria-label="Remove">×</button></div>`; }).join('');
    sess.innerHTML=`<div class="sname"><input value="${esc(s.name)}" data-sname placeholder="Session name"><button class="btn small danger" data-del-session>Delete</button></div>
      <div class="stack" id="items">${items||`<div class="empty">Click exercises on the right to add them here.</div>`}</div>
      <p class="hint">Sets × rep range for each exercise. Drag the dots or use the arrows to reorder.</p>`;
    enableReorder(document.getElementById('items'),s);
  }
  const cats=[...new Set(st.exercises.map(e=>e.category).filter(Boolean))].sort();
  document.getElementById('cats').innerHTML=[''].concat(cats).map(c=>`<button class="${ui.cat===c?'on':''}" data-cat="${esc(c)}">${c||'All'}</button>`).join('');
  const q=ui.q.trim().toLowerCase();
  document.getElementById('lib').innerHTML=st.exercises.filter(e=>(!ui.cat||e.category===ui.cat)&&(!q||e.name.toLowerCase().includes(q))).sort((a,b)=>a.name.localeCompare(b.name)).map(e=>{
    const n=s?s.items.filter(i=>i===e.id).length:0;
    return `<div class="pick" data-pick="${e.id}"><div class="icon">${esc(e.icon)}</div><div class="name">${esc(e.name)}${e.video?' <a href="'+esc(e.video)+'" target="_blank" rel="noopener" title="Video" data-nopick>▶</a>':''}</div><div class="cat">${esc(e.category||'')}</div><button class="btn small ghost" data-edit="${e.id}" title="Edit">✎</button><div class="plus ${n?'in':''}">${n?'Added'+(n>1?' ×'+n:''):'+'}</div></div>`; }).join('')||`<div class="empty">No matches.</div>`;
  const info=document.querySelector('[data-linkinfo]'); const id=st.id||slug(st.name);
  info.innerHTML=id?`File link: put <b>${esc(id)}.json</b> in a <b>plans/</b> folder next to index.html, then share <code>${esc(joinUrl(st.appUrl,'?plan='+id))}</code>`:`Give the plan a name to see its links.`;
}
function joinUrl(base,tail){ return (base||'index.html').replace(/[?#].*$/,'')+tail; }

function usedExercises(){ const used=new Set(st.sessions.flatMap(s=>s.items)); return st.exercises.filter(e=>used.has(e.id)); }
function buildPlan(){ const id=st.id||slug(st.name); if(!st.name||!id){ toast('Give the plan a name first'); return null; }
  if(!st.sessions.some(s=>s.items.length)){ toast('Add at least one exercise to a session'); return null; }
  return {format:'rack-plan-1',id,name:st.name,version:Number(st.version)||1,updated:new Date().toISOString().slice(0,10),
    exercises:usedExercises().map(e=>({id:e.id,name:e.name,icon:e.icon,category:e.category,video:e.video})),
    sessions:st.sessions.filter(s=>s.items.length).map(s=>({id:s.id,name:s.name,items:[...s.items],targets:Object.fromEntries(s.items.map(i=>[i,s.targets[i]||{sets:3,reps:'8-10'}]))}))}; }
const b64enc=o=>{ const u=new TextEncoder().encode(JSON.stringify(o)); let bin=''; for(let i=0;i<u.length;i++) bin+=String.fromCharCode(u[i]); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
async function copy(text,label){ try{ await navigator.clipboard.writeText(text); toast(label+' copied'); }catch{ prompt('Copy this:',text); } }

function importModal(){
  const el=document.createElement('div'); el.className='scrim';
  el.innerHTML=`<div class="sheet"><h3>Import from a spreadsheet</h3><p class="hint" style="margin:0 0 10px">Copy rows from Sheets or Excel and paste. Columns: name, then optionally muscle group and a video link (any order — a header row helps).</p>
    <div class="field"><textarea data-t></textarea></div><p class="hint" data-pv></p>
    <div class="bar"><button class="btn" data-c>Cancel</button><button class="btn primary" data-go>Import</button></div></div>`;
  document.body.appendChild(el); const ta=el.querySelector('[data-t]'),pv=el.querySelector('[data-pv]');
  ta.oninput=()=>{ const r=parseSheet(ta.value); pv.textContent=r.length?`${r.length} rows found · e.g. ${r[0].name}`:''; };
  el.querySelector('[data-c]').onclick=()=>el.remove();
  el.querySelector('[data-go]').onclick=()=>{ const rows=parseSheet(ta.value); let a=0,u=0;
    rows.forEach(r=>{ const ex=st.exercises.find(e=>normName(e.name)===normName(r.name)); if(ex){ if(r.video) ex.video=r.video; if(r.category) ex.category=r.category; u++; } else { st.exercises.push({id:uid(),name:r.name,icon:r.icon||guessIcon(r.name,r.category),category:r.category||'',video:r.video||''}); a++; } });
    save(); el.remove(); render(); toast(`${a} added, ${u} updated`); };
  ta.focus();
}
function parseSheet(text){
  const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean); if(!lines.length) return [];
  const delim=lines[0].includes('\t')?'\t':','; const split=l=>l.split(delim).map(c=>c.trim().replace(/^"|"$/g,''));
  let rows=lines.map(split), map=null; const h=rows[0].map(c=>c.toLowerCase()); const find=(...ks)=>h.findIndex(c=>ks.some(k=>c.includes(k)));
  if(h.some(c=>['name','exercise','activity'].some(k=>c.includes(k)))&&!/https?:/.test(rows[0].join(''))){ map={name:find('name','exercise','activity'),icon:find('icon','emoji'),category:find('category','muscle','group','type'),video:find('video','link','url','explanation')}; rows=rows.slice(1); }
  const isEmoji=s=>s&&s.length<=4&&/\p{Extended_Pictographic}/u.test(s);
  return rows.map(c=>{ let name,icon='',category='',video='';
    if(map){ name=c[map.name]||c[0]; icon=map.icon>=0?c[map.icon]:''; category=map.category>=0?c[map.category]:''; video=map.video>=0?c[map.video]:''; }
    else { name=c[0]; c.slice(1).forEach(x=>{ if(/^https?:\/\//.test(x)) video=x; else if(isEmoji(x)) icon=x; else if(x&&!category) category=x; }); }
    if(!/^https?:\/\//.test(video)) video=''; if(!isEmoji(icon)) icon='';
    if(category) category=category.toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase()).replace('/',' / ');
    return name?{name:name.trim(),icon,category,video}:null; }).filter(Boolean);
}


/* ---------- workbook import (the coaching Google Sheet, downloaded as .xlsx) ---------- */
function loadSheetJS(){ if(window.XLSX) return Promise.resolve(); return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=res; s.onerror=()=>rej(new Error('offline')); document.head.appendChild(s); }); }
const cellText=(ws,r,c)=>{ const cell=ws[XLSX.utils.encode_cell({r,c})]; return cell&&cell.v!=null?String(cell.v).trim():''; };
const cellLink=(ws,r,c)=>{ const cell=ws[XLSX.utils.encode_cell({r,c})]; return cell&&cell.l&&cell.l.Target?cell.l.Target:''; };
function repRange(cell){ if(!cell||cell.v==null) return ''; const v=cell.v;
  if(v&&typeof v.getUTCMonth==='function'){ const a=v.getUTCMonth()+1,b=v.getUTCDate(); return `${Math.min(a,b)}-${Math.max(a,b)}`; } // "8-10" typed into Sheets becomes a date
  return String(v).trim().replace(/\s*(?:–|—|to)\s*/g,'-'); }
function tidyName(n){ n=n.replace(/\s+/g,' ').trim(); if(n===n.toUpperCase()) n=n.toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase()).replace(/\bDb\b/g,'DB').replace(/\bRdls?\b/gi,'RDLs').replace(/\bJpg\b/,'JPG').replace(/\bEz\b/,'EZ'); return n.replace(/\bEz Bar\b/,'EZ Bar'); }
function tidyCat(c){ return (c||'').trim().toLowerCase().replace(/\b\w/g,ch=>ch.toUpperCase()).replace('/',' / ').replace('  ',' '); }
function parseWorkbook(wb){
  const out={name:'',sessions:[],library:[]};
  const dash=wb.Sheets[wb.SheetNames.find(n=>/dashboard/i.test(n))]; if(dash){ const rng=XLSX.utils.decode_range(dash['!ref']); for(let r=rng.s.r;r<=rng.e.r;r++) for(let c=rng.s.c;c<=rng.e.c;c++) if(/client name/i.test(cellText(dash,r,c))){ out.name=cellText(dash,r,c+1)||cellText(dash,r,c+2); } }
  const log=wb.Sheets[wb.SheetNames.find(n=>/exercise log/i.test(n))];
  if(log){ const rng=XLSX.utils.decode_range(log['!ref']); let hdr=-1,cName=-1,cMus=-1,cLink=-1;
    for(let r=rng.s.r;r<=Math.min(rng.e.r,20)&&hdr<0;r++) for(let c=rng.s.c;c<=rng.e.c;c++){ const t=cellText(log,r,c).toUpperCase(); if(t==='EXERCISE'){ hdr=r; cName=c; } if(t==='MUSCLE') cMus=c; if(/EXPLANATION|VIDEO|LINK/.test(t)) cLink=c; }
    if(hdr>=0) for(let r=hdr+1;r<=rng.e.r;r++){ const n=cellText(log,r,cName); if(!n) continue; out.library.push({name:tidyName(n),category:tidyCat(cMus>=0?cellText(log,r,cMus):'')||'Warm Up',video:cLink>=0?cellLink(log,r,cLink):''}); } }
  const plan=wb.Sheets[wb.SheetNames.find(n=>/training plan/i.test(n))];
  if(!plan) throw new Error('No "Training Plan" sheet found');
  const rng=XLSX.utils.decode_range(plan['!ref']);
  for(let r=rng.s.r;r<=rng.e.r;r++){ // a header row has BODY PART … EXERCISE … SETS … REP RANGE; the session name sits 2 rows above in the same column
    let cBody=-1,cEx=-1,cSets=-1,cReps=-1,cLink=-1;
    for(let c=rng.s.c;c<=rng.e.c;c++){ const t=cellText(plan,r,c).toUpperCase(); if(t==='BODY PART') cBody=c; else if(t==='EXERCISE') cEx=c; else if(t==='SETS') cSets=c; else if(t==='REP RANGE') cReps=c; else if(/VIDEO/.test(t)) cLink=c; }
    if(cBody<0||cEx<0) continue;
    let title=''; for(let k=1;k<=3&&!title;k++) title=cellText(plan,r-k,cBody);
    if(!title||/^session name$/i.test(title)) title='';
    const s={name:title?tidyName(title):'',items:[]};
    for(let rr=r+1;rr<=rng.e.r;rr++){ const t=cellText(plan,rr,cBody).toUpperCase(); if(t==='BODY PART') break; if(/TOTAL VOLUME/.test(cellText(plan,rr,cBody+4))||/TOTAL VOLUME/.test(cellText(plan,rr,cBody+3))) break;
      const ex=cellText(plan,rr,cEx); if(!ex) continue;
      s.items.push({name:tidyName(ex),category:tidyCat(cellText(plan,rr,cBody)),sets:Number(cellText(plan,rr,cSets))||3,reps:cReps>=0?repRange(plan[XLSX.utils.encode_cell({r:rr,c:cReps})]):'',video:cLink>=0?cellLink(plan,rr,cLink):''}); }
    if(s.items.length&&s.name) out.sessions.push(s); }
  return out;
}
async function importWorkbook(file){
  try{ await loadSheetJS(); }catch{ return toast('Need to be online the first time (loads the Excel reader)'); }
  let parsed; try{ parsed=parseWorkbook(XLSX.read(await file.arrayBuffer(),{cellDates:true})); }catch(e){ return toast(e.message||"Couldn't read that workbook"); }
  if(!parsed.sessions.length) return toast('No sessions with exercises found in the Training Plan sheet');
  const findEx=n=>st.exercises.find(e=>normName(e.name)===normName(n));
  let added=0; const ensure=(name,category,video)=>{ let ex=findEx(name); if(!ex){ ex={id:uid(),name,icon:guessIcon(name,category),category:category||'',video:video||''}; st.exercises.push(ex); added++; } else { if(video&&!ex.video) ex.video=video; if(category&&!ex.category) ex.category=category; } return ex; };
  parsed.library.forEach(e=>ensure(e.name,e.category,e.video));
  const replace=st.sessions.some(s=>s.items.length)?confirm(`Replace the current sessions with the ${parsed.sessions.length} from the workbook? (Cancel adds them alongside.)`):true;
  if(replace) st.sessions=[];
  parsed.sessions.forEach(s=>{ const n={id:'s_'+uid(),name:s.name,items:[],targets:{}}; s.items.forEach(it=>{ const ex=ensure(it.name,it.category,it.video); n.items.push(ex.id); n.targets[ex.id]={sets:it.sets,reps:it.reps||'8-10'}; }); st.sessions.push(n); });
  if(parsed.name&&(!st.name||replace)){ const nm=tidyName(parsed.name); st.name=`${nm}'s plan`; if(!st._idTouched) st.id=slug(nm); }
  ui.sel=st.sessions[0].id; save(); render();
  toast(`Imported ${parsed.sessions.length} sessions${added?`, ${added} new exercises`:''}${parsed.name?` for ${tidyName(parsed.name)}`:''}`);
}

/* ---------- drag reorder ---------- */
function enableReorder(list,s){
  list.addEventListener('pointerdown',e=>{ const handle=e.target.closest('.handle'); if(!handle) return; e.preventDefault();
    const rows=[...list.querySelectorAll('.row')]; const item=handle.closest('.row'); const from=rows.indexOf(item); const rects=rows.map(r=>r.getBoundingClientRect());
    const gap=rows.length>1?rects[1].top-rects[0].bottom:8; const h=rects[from].height+gap; let to=from; const startY=e.clientY;
    item.classList.add('dragging'); rows.forEach(r=>{ if(r!==item) r.classList.add('shift'); }); handle.setPointerCapture(e.pointerId);
    const move=ev=>{ const dy=ev.clientY-startY; item.style.transform=`translateY(${dy}px)`; const cy=rects[from].top+rects[from].height/2+dy; let t=from;
      for(let i=0;i<rows.length;i++){ if(i===from) continue; const mid=rects[i].top+rects[i].height/2; if(i<from&&cy<mid) t=Math.min(t,i); if(i>from&&cy>mid) t=Math.max(t,i); }
      if(t!==to){ to=t; rows.forEach((r,i)=>{ if(r===item) return; let sh=0; if(i>from&&i<=to) sh=-h; else if(i<from&&i>=to) sh=h; r.style.transform=sh?`translateY(${sh}px)`:''; }); } };
    const up=()=>{ handle.removeEventListener('pointermove',move); handle.removeEventListener('pointerup',up); handle.removeEventListener('pointercancel',up);
      if(to!==from){ const [m]=s.items.splice(from,1); s.items.splice(to,0,m); save(); } render(); };
    handle.addEventListener('pointermove',move); handle.addEventListener('pointerup',up); handle.addEventListener('pointercancel',up); });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.closest('[data-nopick]')) return;
  const t=e.target.closest('[data-sel],[data-add-session],[data-del-session],[data-move],[data-remove],[data-pick],[data-edit],[data-cat],[data-new-ex],[data-import],[data-open],[data-reset],[data-download],[data-copy-link],[data-copy-file-link],[data-workbook]'); if(!t) return; const d=t.dataset;
  const s=st.sessions.find(x=>x.id===ui.sel);
  if(d.sel) { ui.sel=d.sel; render(); }
  else if(d.addSession!==undefined){ const n={id:'s_'+uid(),name:'Session '+(st.sessions.length+1),items:[],targets:{}}; st.sessions.push(n); ui.sel=n.id; save(); render(); setTimeout(()=>document.querySelector('[data-sname]')?.select(),30); }
  else if(d.delSession!==undefined){ if(!confirm(`Delete "${s.name}"?`)) return; st.sessions=st.sessions.filter(x=>x!==s); ui.sel=st.sessions[0]?.id; save(); render(); }
  else if(d.move){ const [i,dir]=d.move.split(':').map(Number); const j=i+dir; if(j<0||j>=s.items.length) return; [s.items[i],s.items[j]]=[s.items[j],s.items[i]]; save(); render(); }
  else if(d.remove!==undefined){ s.items.splice(Number(d.remove),1); save(); render(); }
  else if(d.edit){ e.stopPropagation(); exerciseForm({...exById(d.edit)}); }
  else if(d.pick){ if(!s) return toast('Add a session first'); s.items.push(d.pick); s.targets[d.pick]=s.targets[d.pick]||{sets:3,reps:'8-10'}; save(); render(); }
  else if(d.cat!==undefined){ ui.cat=d.cat; render(); }
  else if(d.newEx!==undefined) exerciseForm({});
  else if(d.import!==undefined) importModal();
  else if(d.reset!==undefined){ if(confirm('Clear this plan and start over? The exercise library is kept.')){ const ex=st.exercises; st=fresh(); st.exercises=ex; ui.sel=st.sessions[0].id; save(); render(); } }
  else if(d.workbook!==undefined){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xlsm'; inp.onchange=()=>{ if(inp.files[0]) importWorkbook(inp.files[0]); }; inp.click(); }
  else if(d.open!==undefined){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange=()=>{ inp.files[0]?.text().then(txt=>{ try{ const p=JSON.parse(txt); if(p.format!=='rack-plan-1') throw 0;
      st.name=p.name; st.id=p.id; st.version=(Number(p.version)||1)+1;
      const idmap={}; p.exercises.forEach(x=>{ let ex=st.exercises.find(y=>normName(y.name)===normName(x.name)); if(!ex){ ex={...x,id:uid()}; st.exercises.push(ex); } else if(x.video&&!ex.video) ex.video=x.video; idmap[x.id]=ex.id; });
      st.sessions=p.sessions.map(x=>({id:x.id,name:x.name,items:x.items.map(i=>idmap[i]).filter(Boolean),targets:Object.fromEntries(Object.entries(x.targets||{}).filter(([k])=>idmap[k]).map(([k,v])=>[idmap[k],v]))}));
      ui.sel=st.sessions[0]?.id; save(); render(); toast(`Opened ${p.name} — version bumped to ${st.version}`); }catch{ toast("That isn't a Rack plan file"); } }); }; inp.click(); }
  else if(d.download!==undefined){ const p=buildPlan(); if(!p) return; const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,1)],{type:'application/json'})); a.download=p.id+'.json'; a.click(); toast(`Saved ${p.id}.json`); }
  else if(d.copyLink!==undefined){ const p=buildPlan(); if(!p) return; const link=joinUrl(st.appUrl,'#plan='+b64enc(p)); copy(link,'Share link'); if(link.length>8000) toast('Link is very long — the file link may be safer'); }
  else if(d.copyFileLink!==undefined){ const p=buildPlan(); if(!p) return; copy(joinUrl(st.appUrl,'?plan='+p.id),'File link'); }
});
document.addEventListener('input',e=>{ const t=e.target;
  if(t.matches('[data-f]')){ st[t.dataset.f]=t.value; if(t.dataset.f==='name'&&!st._idTouched) st.id=slug(t.value); if(t.dataset.f==='id'){ st._idTouched=true; st.id=slug(t.value); } save(); if(t.dataset.f!=='id') render(); else document.querySelector('[data-linkinfo]').innerHTML=''; }
  if(t.matches('[data-sname]')){ const s=st.sessions.find(x=>x.id===ui.sel); s.name=t.value; save(); document.querySelector(`[data-sel="${s.id}"]`).textContent=t.value||'Untitled'; }
  if(t.matches('[data-tgt]')){ const [id,f]=t.dataset.tgt.split(':'); const s=st.sessions.find(x=>x.id===ui.sel); const tg=s.targets[id]||(s.targets[id]={sets:3,reps:'8-10'}); tg[f]=f==='sets'?Math.max(1,Number(t.value)||1):t.value.trim(); save(); }
  if(t.id==='q'){ ui.q=t.value; const pos=t.selectionStart; render(); const n=document.getElementById('q'); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener('change',e=>{ if(e.target.matches('[data-f=id]')) render(); });
render();
